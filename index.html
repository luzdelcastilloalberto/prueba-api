<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espuma · Cervecerías del mundo</title>
  <meta name="description" content="Descubre cervecerías de todo el mundo con la Open Brewery DB.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>

  <header class="hero">
    <nav class="nav">
      <a class="logo" href="#">🍺 Espuma</a>
      <button id="btnRandom" class="btn btn-ghost">🎲 Sorpréndeme</button>
    </nav>
    <div class="hero-content">
      <p class="eyebrow">Open Brewery DB</p>
      <h1>Encuentra tu próxima <span>caña</span></h1>
      <p class="sub">Explora miles de cervecerías artesanas del mundo. Busca por nombre, ciudad, país o tipo.</p>

      <form id="searchForm" class="search" role="search">
        <input id="q" type="search" placeholder="Busca: «stone», «Dublin», «ale»…" aria-label="Buscar cervecerías" autocomplete="off">
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>
    </div>
    <svg class="wave" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C240,100 480,0 720,40 C960,80 1200,10 1440,50 L1440,90 L0,90 Z"/>
    </svg>
  </header>

  <main>
    <section class="stats" id="stats" aria-live="polite"></section>

    <section class="filters">
      <div class="field">
        <label for="country">País</label>
        <select id="country"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="city">Ciudad</label>
        <input id="city" type="text" placeholder="p. ej. Portland">
      </div>
      <div class="field">
        <label for="type">Tipo</label>
        <select id="type">
          <option value="">Todos</option>
          <option value="micro">Micro</option>
          <option value="nano">Nano</option>
          <option value="regional">Regional</option>
          <option value="brewpub">Brewpub</option>
          <option value="large">Large</option>
          <option value="planning">Planning</option>
          <option value="bar">Bar</option>
          <option value="contract">Contract</option>
          <option value="proprietor">Proprietor</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">Orden</label>
        <select id="sort">
          <option value="name:asc">Nombre A→Z</option>
          <option value="name:desc">Nombre Z→A</option>
          <option value="city:asc">Ciudad A→Z</option>
          <option value="type:asc">Tipo</option>
        </select>
      </div>
      <button id="btnReset" class="btn btn-ghost" type="button">Limpiar</button>
    </section>

    <div id="status" class="status" role="status"></div>
    <section id="grid" class="grid"></section>

    <nav class="pager" id="pager" aria-label="Paginación">
      <button id="prev" class="btn btn-ghost">← Anterior</button>
      <span id="pageInfo">Página 1</span>
      <button id="next" class="btn btn-ghost">Siguiente →</button>
    </nav>
  </main>

  <dialog id="modal">
    <button class="close" id="closeModal" aria-label="Cerrar">✕</button>
    <div id="modalBody"></div>
  </dialog>

  <footer>
    <p>Datos de <a href="https://www.openbrewerydb.org/" target="_blank" rel="noopener">Open Brewery DB</a> · Bebe con moderación 🍻</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
