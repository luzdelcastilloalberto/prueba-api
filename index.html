<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espuma · Catálogo de cervezas</title>
  <meta name="description" content="Catálogo de cervezas con ABV, IBU, descripción y maridajes.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>

  <header class="hero">
    <nav class="nav">
      <a class="logo" href="#">🍺 Espuma</a>
      <button id="btnRandom" class="btn btn-ghost">🎲 Sorpréndeme</button>
    </nav>
    <div class="hero-content">
      <p class="eyebrow">Catálogo de cervezas</p>
      <h1>Encuentra tu próxima <span>caña</span></h1>
      <p class="sub">Explora cervezas con su graduación, amargor, historia y con qué maridarlas.</p>
      <form id="searchForm" class="search" role="search">
        <input id="q" type="search" placeholder="Busca por nombre: «punk», «ipa», «stout»…" aria-label="Buscar cervezas" autocomplete="off">
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>
    </div>
    <svg class="wave" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C240,100 480,0 720,40 C960,80 1200,10 1440,50 L1440,90 L0,90 Z"/>
    </svg>
  </header>

  <main>
    <section class="filters">
      <div class="field">
        <label for="strength">Graduación (ABV)</label>
        <select id="strength">
          <option value="">Todas</option>
          <option value="0-4.5">Suave (&lt; 4,5%)</option>
          <option value="4.5-7">Media (4,5 – 7%)</option>
          <option value="7-100">Fuerte (&gt; 7%)</option>
        </select>
      </div>
      <div class="field">
        <label for="food">Maridaje</label>
        <input id="food" type="text" placeholder="p. ej. chicken, cheese">
      </div>
      <div class="field">
        <label for="sort">Orden</label>
        <select id="sort">
          <option value="id">Por defecto</option>
          <option value="name">Nombre A→Z</option>
          <option value="abv-desc">Más fuertes primero</option>
          <option value="abv-asc">Más suaves primero</option>
          <option value="ibu-desc">Más amargas primero</option>
        </select>
      </div>
      <button id="btnReset" class="btn btn-ghost" type="button">Limpiar</button>
    </section>

    <div id="status" class="status" role="status"></div>
    <section id="grid" class="grid"></section>

    <nav class="pager" id="pager" aria-label="Paginación">
      <button id="prev" class="btn btn-ghost">← Anterior</button>
      <span id="pageInfo">Página 1</span>
      <button id="next" class="btn btn-ghost">Siguiente →</button>
    </nav>
  </main>

  <dialog id="modal">
    <button class="close" id="closeModal" aria-label="Cerrar">✕</button>
    <div id="modalBody"></div>
  </dialog>

  <footer><p>Datos de PunkAPI · Bebe con moderación 🍻</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
